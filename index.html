<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E5A48">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="小川会館">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>小川会館 予約受付</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232E5A48'/%3E%3Crect x='14' y='14' width='36' height='40' rx='3' fill='%23fff'/%3E%3Ccircle cx='18' cy='16' r='5' fill='%23B08A3E'/%3E%3Cpath d='M22 28h20M22 36h20M22 44h12' stroke='%232E5A48' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{
  --board:#2E5A48; --board-deep:#1F4033; --board-soft:#E4EDE7;
  --bg:#EDF1EC; --paper:#FFFFFF; --ink:#1C2621; --sub:#58675F; --line:#D2DAD1;
  --brass:#B08A3E;
  --hold:#C98612; --hold-soft:#FBF0D9;
  --appr:#3A6EA5; --appr-soft:#E2EBF6;
  --paid:#2E7D55; --paid-soft:#DCEFE3;
  --danger:#B5473A; --danger-soft:#F6E1DD;
  --done:#6F7B75; --done-soft:#ECEFED;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;font-size:16px;line-height:1.65;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px));-webkit-text-size-adjust:100%}
h1,h2,h3,.maru{font-family:"Zen Maru Gothic","BIZ UDPGothic",sans-serif;font-weight:700;letter-spacing:.02em}
h2{font-size:1.1rem;margin:0 0 12px}
h2 small{font-family:"BIZ UDPGothic",sans-serif;font-weight:400;font-size:.8rem;color:var(--sub);margin-left:6px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
[hidden]{display:none!important}

/* ヘッダー：掲示板に貼り紙 */
.top{background:var(--board);padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 20px;position:relative}
.top-in{max-width:880px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.slip{background:var(--paper);display:inline-block;padding:10px 20px 10px 24px;position:relative;box-shadow:0 3px 0 rgba(0,0,0,.18);transform:rotate(-1.2deg)}
.slip::before{content:"";position:absolute;left:-7px;top:-7px;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#EBD396,var(--brass) 60%,#6E5420);box-shadow:1px 2px 2px rgba(0,0,0,.3)}
.slip h1{margin:0;font-size:clamp(1.05rem,5vw,1.3rem);white-space:nowrap;line-height:1.2;border-bottom:2px solid var(--ink);padding-bottom:2px}
.slip small{display:block;font-size:.72rem;color:var(--sub);margin-top:3px}
.badge{font-size:.75rem;background:var(--brass);color:#fff;padding:3px 10px;border-radius:99px;white-space:nowrap}
.badge.admin{background:#fff;color:var(--board-deep)}

main{max-width:880px;margin:0 auto;padding:16px 14px 24px}
.card{background:var(--paper);border-radius:14px;padding:16px;margin-bottom:14px;border:1px solid var(--line)}
.hint{font-size:.85rem;color:var(--sub);margin:10px 0 0}
.note{background:var(--hold-soft);border-left:4px solid var(--hold);padding:10px 12px;border-radius:6px;margin-bottom:14px;font-size:.92rem}

/* ボタン */
.btn{appearance:none;border:0;background:var(--board);color:#fff;font-weight:700;min-height:48px;padding:10px 18px;border-radius:10px;cursor:pointer;font-family:"Zen Maru Gothic","BIZ UDPGothic",sans-serif;font-size:1rem}
.btn:hover{background:var(--board-deep)}
.btn:disabled{background:#AEB9B2;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--board);border:2px solid var(--board)}
.btn.ghost:hover{background:var(--board-soft)}
.btn.danger{background:var(--danger)}
.btn.appr{background:var(--appr)}
.btn.wide{width:100%;margin-top:14px}
.btn.sm{min-height:38px;padding:6px 12px;font-size:.9rem}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.link{background:none;border:0;color:var(--board);text-decoration:underline;cursor:pointer;padding:4px 0;font-size:.92rem}

/* 利用区分 */
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.chip{display:flex;align-items:center;gap:8px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;min-height:52px;font-size:.9rem;line-height:1.3}
.chip b{flex:none;width:28px;height:28px;border-radius:6px;display:grid;place-items:center;background:var(--board-soft);color:var(--board-deep);font-family:"Zen Maru Gothic",sans-serif}
.chip.on{border-color:var(--board);background:var(--board-soft)}
.chip.on b{background:var(--board);color:#fff}

/* 日付 */
.datehead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.datehead h2{margin:0;font-size:1.25rem}
.datehead input{border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:44px;background:#fff}
.strip{display:flex;align-items:center;gap:6px}
.strip .nav{flex:none;width:36px;height:64px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:1.4rem;cursor:pointer}
.strip .nav:disabled{opacity:.35;cursor:default}
.days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1}
.days::-webkit-scrollbar{display:none}
.day{flex:none;width:52px;height:64px;border:1px solid var(--line);background:#fff;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;padding:0 0 6px}
.day span{font-size:.72rem;color:var(--sub)}
.day b{font-size:1.15rem;line-height:1.1}
.day i{position:absolute;left:8px;right:8px;bottom:6px;height:4px;border-radius:2px;background:var(--board-soft);overflow:hidden}
.day i::after{content:"";position:absolute;inset:0;width:calc(var(--r) * 100%);background:var(--hold)}
.day.wd0 span,.day.wd0 b{color:var(--danger)}
.day.wd6 span,.day.wd6 b{color:var(--appr)}
.day.on{background:var(--board);border-color:var(--board)}
.day.on span,.day.on b{color:#fff}

/* 空き状況ボード */
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.8rem;color:var(--sub);margin-bottom:10px}
.lg::before{content:"";display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:4px;border:1px solid var(--line);background:#fff}
.lg.sel::before{background:var(--board);border-color:var(--board)}
.lg.hold::before{background:var(--hold-soft);border-color:var(--hold)}
.lg.fixed::before{background:repeating-linear-gradient(45deg,#DDE3DE 0 4px,#CBD3CD 4px 8px);border-color:#B9C3BC}
.board{display:grid;grid-template-columns:minmax(78px,1fr) repeat(3,minmax(0,1.4fr));gap:6px}
.bh{text-align:center;font-size:.9rem;line-height:1.25;padding:4px 0}
.bh small{display:block;font-size:.72rem;color:var(--sub)}
.rh{display:flex;align-items:center;font-weight:700;font-size:.95rem;padding-left:2px}
.cell{min-height:54px;border-radius:8px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-size:.92rem;padding:4px}
.cell.free:hover{border-color:var(--board);background:var(--board-soft)}
.cell.sel{background:var(--board);border-color:var(--board);color:#fff;font-weight:700;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.cell.hold{background:var(--hold-soft);border-color:var(--hold);color:#7A510A;cursor:not-allowed}
.cell.fixed{background:repeating-linear-gradient(45deg,#E4E9E5 0 6px,#D6DDD8 6px 12px);color:var(--sub);cursor:not-allowed}
.cell.blocked,.cell.na,.cell.past{background:#F3F5F3;color:#9AA59F;cursor:not-allowed;font-size:.8rem;border-style:dashed}

.ceremony{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-bottom:10px}
.cday{border-radius:10px;padding:12px 14px;border:2px solid}
.cday b{display:block}
.cday.ok{border-color:var(--paid);background:var(--paid-soft)}
.cday.ng{border-color:var(--danger);background:var(--danger-soft)}
.check{display:flex;align-items:flex-start;gap:10px;padding:8px 0;cursor:pointer}
.check input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--board)}

/* 選択バー */
.selbar{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:5;background:var(--board-deep);color:#fff;border-radius:14px;padding:10px 10px 10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 6px 20px rgba(20,40,30,.25)}
.selbar small{display:block;font-size:.8rem;opacity:.85;line-height:1.35}
.selbar b{font-size:1.35rem;font-family:"Zen Maru Gothic",sans-serif}
.selbar .btn{background:#fff;color:var(--board-deep)}
.selbar .btn:disabled{background:rgba(255,255,255,.3);color:rgba(255,255,255,.7)}

/* フォーム */
.field{margin-bottom:12px}
.field label{display:block;font-size:.9rem;font-weight:700;margin-bottom:4px}
.field label em{font-style:normal;color:var(--danger);font-size:.78rem;margin-left:6px;font-weight:400}
.field input,.field select,.field textarea,.row input{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;min-height:48px;background:#fff}
.field textarea{min-height:80px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.row{display:flex;gap:8px}
.row input{flex:1}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0 0 12px;font-size:.95rem}
dl.kv dt{color:var(--sub);white-space:nowrap}
dl.kv dd{margin:0;word-break:break-all}
table.fee{width:100%;border-collapse:collapse;font-size:.95rem}
table.fee td,table.fee th{padding:7px 4px;border-bottom:1px dashed var(--line);text-align:left}
table.fee td:last-child,table.fee th:last-child{text-align:right;white-space:nowrap}
table.fee tr.total th{border-bottom:0;border-top:2px solid var(--ink);font-size:1.1rem}
table.fee tr.adj td{color:var(--appr)}

/* 受付完了 */
.receipt-no{text-align:center;padding:20px 10px;border:2px dashed var(--board);border-radius:12px;margin:12px 0;background:var(--board-soft)}
.receipt-no small{display:block;color:var(--sub)}
.receipt-no b{font-size:2rem;letter-spacing:.08em;font-family:"Zen Maru Gothic",sans-serif}

/* 状況ステップ */
.steps{list-style:none;padding:0;margin:14px 0;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;counter-reset:s}
.steps li{text-align:center;font-size:.78rem;color:var(--sub);position:relative;padding-top:34px;counter-increment:s}
.steps li::before{content:counter(s);position:absolute;top:0;left:50%;transform:translateX(-50%);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#fff;border:2px solid var(--line);font-weight:700}
.steps li.on{color:var(--ink);font-weight:700}
.steps li.on::before{background:var(--board);border-color:var(--board);color:#fff}

/* ステータス */
.pill{display:inline-block;font-size:.78rem;font-weight:700;padding:2px 10px;border-radius:99px;white-space:nowrap}
.pill.hold{background:var(--hold-soft);color:#8A5A08}
.pill.appr{background:var(--appr-soft);color:var(--appr)}
.pill.paid{background:var(--paid-soft);color:var(--paid)}
.pill.done{background:var(--done-soft);color:var(--done)}
.pill.danger{background:var(--danger-soft);color:var(--danger)}
.flag{display:inline-block;font-size:.74rem;color:var(--danger);border:1px solid var(--danger);border-radius:4px;padding:0 6px;margin-left:4px}

/* 料金表 */
.feegrid{width:100%;border-collapse:collapse;font-size:.92rem;margin-bottom:6px}
.feegrid th,.feegrid td{border:1px solid var(--line);padding:6px 6px;text-align:right}
.feegrid thead th{background:var(--board-soft);text-align:center;font-weight:700}
.feegrid tbody th{text-align:left;font-weight:700;white-space:nowrap;background:#FAFBFA}
.scroll{overflow-x:auto}
.cat-title{display:flex;align-items:center;gap:8px;margin:18px 0 8px}
.cat-title:first-child{margin-top:0}
.cat-title b{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;background:var(--board);color:#fff;font-family:"Zen Maru Gothic",sans-serif;flex:none}

/* 管理 */
.subtabs{display:flex;gap:4px;background:var(--board-soft);padding:4px;border-radius:12px;margin-bottom:14px}
.subtabs button{flex:1;white-space:nowrap;font-size:.92rem;border:0;background:transparent;min-height:42px;border-radius:9px;cursor:pointer;font-weight:700;color:var(--sub)}
.subtabs button.on{background:#fff;color:var(--board-deep);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.filters button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;cursor:pointer;font-size:.88rem;min-height:38px}
.filters button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.filters button i{font-style:normal;font-weight:700;margin-left:4px}
.req{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer;text-align:left;width:100%}
.req:hover{border-color:var(--board)}
.req .dt{text-align:center;border-right:1px solid var(--line);padding-right:10px;line-height:1.2}
.req .dt b{display:block;font-size:1.4rem;font-family:"Zen Maru Gothic",sans-serif}
.req .dt small{font-size:.75rem;color:var(--sub)}
.req .who{font-weight:700}
.req .what{font-size:.85rem;color:var(--sub);line-height:1.4}
.req .right{text-align:right;line-height:1.5}
.req .right b{display:block;font-size:.95rem}
.empty{text-align:center;color:var(--sub);padding:28px 10px}
.monthnav{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:12px}
.monthnav b{font-size:1.15rem;min-width:120px;text-align:center;font-family:"Zen Maru Gothic",sans-serif}
.monthnav button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:1.2rem;cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal .wh{text-align:center;font-size:.78rem;color:var(--sub);padding:2px 0}
.cal .wh:first-child{color:var(--danger)}.cal .wh:last-child{color:var(--appr)}
.cal .cd{min-height:70px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:3px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.cal .cd.blank{background:transparent;border:0;cursor:default}
.cal .cd.today{border:2px solid var(--board)}
.cal .cd .n{font-size:.8rem;font-weight:700}
.ev{display:block;font-size:.68rem;border-radius:3px;padding:0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.5}
.ev.hold{background:var(--hold-soft);color:#7A510A}.ev.appr{background:var(--appr-soft);color:var(--appr)}.ev.paid{background:var(--paid-soft);color:var(--paid)}.ev.done{background:var(--done-soft);color:var(--done)}
.more{font-size:.68rem;color:var(--sub)}
@media (max-width:560px){.ev{font-size:0;height:6px;padding:0}.cal .cd{min-height:56px}}
.daytable{width:100%;border-collapse:collapse;font-size:.85rem;margin-bottom:12px}
.daytable th,.daytable td{border:1px solid var(--line);padding:5px;vertical-align:top}
.daytable thead th{background:var(--board-soft)}
.daytable tbody th{text-align:left;white-space:nowrap}
.stat{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:1rem}
.stat dt{color:var(--sub)}.stat dd{margin:0;text-align:right;font-weight:700}
.stat dd.warn{color:var(--danger)}
table.list{width:100%;border-collapse:collapse;font-size:.9rem}
table.list th,table.list td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}
table.list td.r,table.list th.r{text-align:right}
pre.rules{background:#F4F6F4;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:.75rem;overflow-x:auto;white-space:pre}
.infobox{background:#F7F9F7;border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:12px}
.infobox h3{margin:0 0 8px;font-size:1rem}

/* シート */
#sheet{position:fixed;inset:0;z-index:50;display:none}
#sheet.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(20,32,26,.45)}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;background:var(--paper);border-radius:18px 18px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@media (min-width:720px){.panel{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:640px;border-radius:18px;animation:none}}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.sheet-head h2{margin:6px 0 2px;font-size:1.25rem}
.sheet-head small{color:var(--sub);font-size:.8rem}
.x{border:0;background:var(--bg);width:40px;height:40px;border-radius:50%;font-size:1.3rem;cursor:pointer;flex:none}
.sec{border-top:1px solid var(--line);padding-top:12px;margin-top:14px}
.sec h3{font-size:1rem;margin:0 0 8px}

/* 下部ナビ */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;border:0;background:none;min-height:62px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.78rem;color:var(--sub)}
.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--board);font-weight:700}

#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:.92rem;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.show{opacity:1}

/* 領収書印刷 */
#print{display:none}
@media print{
  body{background:#fff;padding:0}
  body>*:not(#print){display:none!important}
  #print{display:block}
  .rc{width:170mm;margin:10mm auto;border:1.5px solid #000;padding:12mm 14mm;font-family:"BIZ UDPGothic",serif;color:#000}
  .rc h1{text-align:center;letter-spacing:.6em;font-size:22pt;margin:0 0 6mm}
  .rc .meta{text-align:right;font-size:10pt}
  .rc .to{font-size:15pt;border-bottom:1px solid #000;display:inline-block;min-width:90mm;margin:6mm 0}
  .rc .amt{font-size:24pt;text-align:center;border-top:2px solid #000;border-bottom:2px solid #000;padding:3mm 0;margin:4mm 0;font-weight:700}
  .rc table{width:100%;border-collapse:collapse;font-size:10pt;margin:4mm 0}
  .rc td{border-bottom:1px dotted #000;padding:1.5mm 0}
  .rc td:last-child{text-align:right}
  .rc .issuer{text-align:right;margin-top:10mm;font-size:12pt;position:relative;padding-right:22mm}
  .rc .stamp{position:absolute;right:0;top:-3mm;width:18mm;height:18mm;border:1px solid #000;border-radius:50%;display:grid;place-items:center;font-size:10pt}
}
.note.ok{background:var(--paid-soft);border-color:var(--paid)}
.note.ng{background:var(--danger-soft);border-color:var(--danger)}
.req.static{cursor:default}.req.static:hover{border-color:var(--line)}
.req .right small{display:block;font-size:.72rem;color:var(--sub)}
.subtabs button{padding:0 2px;font-size:.85rem}
.subtabs .cnt{font-style:normal;display:inline-block;min-width:18px;height:18px;line-height:18px;border-radius:9px;background:var(--danger);color:#fff;font-size:.7rem;margin-left:3px;padding:0 5px}

<body>
<header class="top">
  <div class="top-in">
    <div class="slip"><h1>小川会館 予約受付</h1><small>申込・空き状況・料金</small></div>
    <div class="topr"><button class="badge install" id="installBtn" hidden onclick="installApp()">アプリとして入れる</button><span class="badge" id="demoBadge" hidden>お試しモード</span> <span class="badge admin" id="adminBadge" hidden>管理者</span></div>
  </div>
</header>
<main id="app"></main>
<nav class="tabs" aria-label="画面の切り替え">
  <button data-v="board" onclick="go('board')"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>空き・申込</button>
  <button data-v="my" onclick="go('my')"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>マイページ</button>
  <button data-v="fees" onclick="go('fees')"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zM4 10h16M10 10v10"/></svg>料金表</button>
  <button data-v="admin" onclick="go('admin')"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>管理</button>
</nav>
<div id="sheet"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="print"></div>

<script>
/* =========================================================
   設定（ここを書き換えてください）
   FIREBASE_CONFIG の apiKey が空のままだと「お試しモード」で動きます
   （データはこの端末のブラウザにだけ保存されます）
   ========================================================= */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCVbfpe_4HdY5J1_ccdAi6AFF-lS4pmZ6M",
  authDomain: "ogawa-machida.firebaseapp.com",
  databaseURL: "https://ogawa-machida-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "ogawa-machida",
  storageBucket: "ogawa-machida.firebasestorage.app",
  messagingSenderId: "864551639060",
  appId: "1:864551639060:web:02bf724ca74e62a973ef01"
};
const HALL = {
  name: "小川会館",
  issuer: "小川会館 管理人",               // 領収書の発行者名
  contact: "小川会館 管理人までご連絡ください", // 取消・問い合わせ先の案内文
  demoPin: "0000"                          // お試しモードの管理者PIN
};
const ROOT = "ogawaHall"; // Realtime Database 上の保存先

/* ===== 料金表（平成17年5月22日改訂） ===== */
const ROOMS = [
  {id:"HA",name:"ホールA",short:"ホA"},{id:"HB",name:"ホールB",short:"ホB"},
  {id:"WA",name:"和室A",short:"和A"},{id:"WB",name:"和室B",short:"和B"},
  {id:"KG",name:"会議室",short:"会議"},{id:"ALL",name:"全室",short:"全室"}
];
const ROOM_IDS = ["HA","HB","WA","WB","KG"];
const SLOTS = [
  {id:"am",name:"午前",time:"9:00〜12:00"},
  {id:"pm",name:"午後",time:"13:00〜17:00"},
  {id:"ev",name:"夜間",time:"18:00〜22:00"}
];
const CATS = {
  A:{name:"登録会員"},
  B:{name:"一般"},
  C:{name:"老人会・婦人会・子供会"},
  D:{name:"福祉活動会員・加盟自治会"}
};
// [1枠（午前・午後・夜間それぞれ）, 全日]
const FEES = {
  A:{HA:[700,1800],HB:[700,1800],WA:[500,1300],WB:[400,1000],KG:[300,800],ALL:[2200,5500]},
  B:{HA:[1400,3600],HB:[1400,3600],WA:[1000,2600],WB:[800,2000],KG:[600,1600],ALL:[4400,11000]},
  C:{HA:[450,1200],HB:[450,1200],WA:[300,800],WB:[250,650],KG:[200,550]},
  D:{HA:[200,600],HB:[200,600],WA:[100,300],WB:[100,300],KG:[100,300]}
};
const CHECK_ITEMS = [
  ["clean","床・机の清掃"],["trash","ゴミの持ち帰り"],["layout","机・椅子・備品を元の位置へ"],
  ["ac","冷暖房・換気扇の停止"],["light","消灯"],["water","ガス・水道の確認"],
  ["lock","窓・戸の施錠"],["shoe","下足入れの整理"],["key","鍵の返却"]
];
const ST = {
  tentative:{pub:"仮予約（利用者登録の承認待ち）",adm:"仮予約",cls:"hold"},
  applied:{pub:"仮予約",adm:"仮予約",cls:"hold"},
  approved:{pub:"予約確定・お支払い待ち",adm:"確定・未払",cls:"appr"},
  paid:{pub:"お支払い済み",adm:"支払済",cls:"paid"},
  done:{pub:"ご利用完了",adm:"完了",cls:"done"},
  rejected:{pub:"お受けできませんでした",adm:"却下",cls:"danger"},
  cancelled:{pub:"取り消しになりました",adm:"取消",cls:"danger"}
};
const USER_ST = {
  pending:{name:"登録審査中",cls:"hold"},
  active:{name:"登録済み",cls:"paid"},
  rejected:{name:"登録不可",cls:"danger"}
};

/* ===== 小道具 ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const yen = n => "¥" + Number(n || 0).toLocaleString("ja-JP");
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const WD = "日月火水木金土";
const fmtDate = s => { if(!s) return ""; const d = parse(s); return `${d.getMonth()+1}月${d.getDate()}日（${WD[d.getDay()]}）`; };
const fmtFull = s => s ? `${parse(s).getFullYear()}年${fmtDate(s)}` : "";
const fmtTs = t => { if(!t) return ""; const d = new Date(t); return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const clean = o => JSON.parse(JSON.stringify(o));
const slotName = id => SLOTS.find(s => s.id === id).name;
const slotOrder = (a, b) => SLOTS.findIndex(s => s.id === a) - SLOTS.findIndex(s => s.id === b);
const isTent = r => r.status === "tentative" || r.status === "applied";
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 3400); }

/* ===== 状態 ===== */
const S = {
  view:"board", date:today(), stripStart:today(), cat:"A", sel:new Set(), days:1, stay:false,
  form:{}, slots:{}, requests:{}, users:{}, adminReqs:{}, roster:{}, imp:null,
  user:null, me:null, myReqs:{}, myAdminReq:null, isAdmin:false,
  adminTab:"list", filter:"tentative", month:today().slice(0,7),
  adminEntry:false, openId:null, openUid:null, sheetMode:null
};

/* ===== 保存先（Firebase / お試しモード） ===== */
const DEMO = !FIREBASE_CONFIG.apiKey || typeof firebase === "undefined";
let db = null, auth = null;
const demoListeners = [];
const DEMO_KEY = "ogawaHallDemo";
let demoTree = {};
if (DEMO) { try { demoTree = JSON.parse(localStorage.getItem(DEMO_KEY) || "{}"); } catch(e) { demoTree = {}; } }
function dget(p){ return p.split("/").reduce((o,k) => o == null ? null : (o[k] ?? null), demoTree); }
function dset(p, v){
  const ks = p.split("/"); let o = demoTree;
  for (let i = 0; i < ks.length-1; i++) { if (typeof o[ks[i]] !== "object" || o[ks[i]] === null) o[ks[i]] = {}; o = o[ks[i]]; }
  const last = ks[ks.length-1];
  if (v === null || v === undefined) delete o[last]; else o[last] = clean(v);
}
const store = {
  async get(p){
    if (DEMO) return clean(dget(p));
    return (await db.ref(`${ROOT}/${p}`).once("value")).val();
  },
  async update(obj){
    if (DEMO) {
      for (const k in obj) dset(k, obj[k]);
      try { localStorage.setItem(DEMO_KEY, JSON.stringify(demoTree)); } catch(e) {}
      demoListeners.slice().forEach(l => l.cb(clean(dget(l.p))));
      return;
    }
    const o = {}; for (const k in obj) o[`${ROOT}/${k}`] = obj[k] === undefined ? null : obj[k];
    await db.ref().update(o);
  },
  on(p, cb){
    if (DEMO) { const l = {p, cb}; demoListeners.push(l); cb(clean(dget(p))); return () => { const i = demoListeners.indexOf(l); if (i >= 0) demoListeners.splice(i, 1); }; }
    const r = db.ref(`${ROOT}/${p}`); const h = s => cb(s.val());
    r.on("value", h, e => console.warn(p, e.message));
    return () => r.off("value", h);
  },
  onQuery(p, key, val, cb){
    if (DEMO) {
      const l = {p, cb:v => { const o = {}; Object.entries(v || {}).forEach(([k, x]) => { if (x && x[key] === val) o[k] = x; }); cb(o); }};
      demoListeners.push(l); l.cb(clean(dget(p)));
      return () => { const i = demoListeners.indexOf(l); if (i >= 0) demoListeners.splice(i, 1); };
    }
    const r = db.ref(`${ROOT}/${p}`).orderByChild(key).equalTo(val); const h = s => cb(s.val());
    r.on("value", h, e => console.warn(p, e.message));
    return () => r.off("value", h);
  }
};

/* ===== ログイン ===== */
let userUnsubs = [], adminUnsubs = [];
function watchUser(u){
  userUnsubs.forEach(f => f()); userUnsubs = [];
  S.user = u; S.me = null; S.myReqs = {}; S.myAdminReq = null; S.orgId = null; S.form = {};
  setAdmin(false);
  if (u) {
    userUnsubs.push(store.on(`admins/${u.uid}`, v => setAdmin(v === true)));
    let tried = false;
    userUnsubs.push(store.on(`users/${u.uid}`, v => { S.me = v; applyMeToSelection(); if (S.view !== "form") render(); if (!(v && v.orgs) && !tried) { tried = true; tryRosterActivate(); } }));
    userUnsubs.push(store.on(`adminRequests/${u.uid}`, v => { S.myAdminReq = v; if (S.view === "admin") render(); }));
    userUnsubs.push(store.onQuery("requests", "uid", u.uid, v => { S.myReqs = v || {}; if (S.view === "my") render(); }));
  }
  render();
}
const DEMO_USERS = [
  {uid:"demo-user-1", displayName:"デモ利用者1", email:"user1@example.com"},
  {uid:"demo-user-2", displayName:"デモ利用者2", email:"user2@example.com"}
];
const emailKey = e => { e = String(e || "").trim().toLowerCase(); return e && e.includes("@") && !/[#$\[\]\/]/.test(e) ? e.replace(/\./g, ",") : ""; };
const isVerified = u => !!u && (DEMO || u.emailVerified !== false);
const AUTH_ERR = {
  "auth/invalid-email":"メールアドレスの形式が正しくありません",
  "auth/invalid-credential":"メールアドレスかパスワードが違います",
  "auth/invalid-login-credentials":"メールアドレスかパスワードが違います",
  "auth/wrong-password":"メールアドレスかパスワードが違います",
  "auth/user-not-found":"このメールアドレスのアカウントはありません。「はじめての方はアカウントを作る」から登録してください",
  "auth/email-already-in-use":"このメールアドレスはすでに登録されています。ログインしてください",
  "auth/weak-password":"パスワードは6文字以上にしてください",
  "auth/missing-password":"パスワードを入力してください",
  "auth/too-many-requests":"試行回数が多すぎます。しばらくしてからお試しください",
  "auth/network-request-failed":"通信できませんでした。電波の状態を確認してください",
  "auth/operation-not-allowed":"このログイン方法が有効になっていません（Firebase の設定が必要です）",
  "auth/unauthorized-domain":"このアドレスからのログインが許可されていません（Firebase の承認済みドメインに追加が必要です）",
  "auth/account-exists-with-different-credential":"このメールアドレスは別のログイン方法で登録されています"
};
const authMsg = e => AUTH_ERR[e.code] || ("ログインできませんでした：" + (e.code || e.message));
function signIn(mode){
  mode = mode === "signup" ? "signup" : "login"; const up = mode === "signup";
  showSheet(`<div class="sheet-head"><div><h2>${up ? "アカウントを作る" : "ログイン"}</h2><small>Google アカウントか、メールアドレスとパスワードで${up ? "登録" : "ログイン"}します</small></div><button class="x" onclick="closeSheet()" aria-label="閉じる">×</button></div>
    <button class="btn wide gbtn" onclick="googleSignIn()"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.5l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.6 5.4 2.7 13.2l7.8 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4 7.1-10 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.3.8-4.7l-7.8-6.1C1 16.6 0 20.2 0 24s1 7.4 2.7 10.8l7.8-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.8 6.1C6.6 42.6 14.6 48 24 48z"/></svg>Google で${up ? "登録" : "ログイン"}</button>
    <div class="or"><span>または メールアドレスで</span></div>
    <div class="field"><label for="lg_email">メールアドレス</label><input id="lg_email" type="email" autocomplete="email" inputmode="email"></div>
    <div class="field"><label for="lg_pw">パスワード${up ? "<em style='color:var(--sub)'>6文字以上</em>" : ""}</label><input id="lg_pw" type="password" autocomplete="${up ? "new-password" : "current-password"}" onkeydown="if(event.key==='Enter')emailAuth('${mode}')"></div>
    <button class="btn wide" style="margin-top:2px" onclick="emailAuth('${mode}')">${up ? "アカウントを作る" : "メールアドレスでログイン"}</button>
    <div class="btns" style="justify-content:space-between">${up ? `<button class="link" onclick="signIn('login')">アカウントをお持ちの方はログイン</button>`
      : `<button class="link" onclick="signIn('signup')">はじめての方はアカウントを作る</button><button class="link" onclick="resetPw()">パスワードを忘れた</button>`}</div>
    ${DEMO ? `<div class="infobox"><h3>お試しモード</h3><p style="margin-top:0">メールアドレスとパスワードは何を入れてもログインできます。下のボタンでも入れます。</p>
      <div class="btns" style="margin-top:0">${DEMO_USERS.map((u, i) => `<button class="btn ghost sm" onclick="demoSignIn(${i})">${u.displayName}</button>`).join("")}</div>
      <p style="margin:12px 0 4px">管理者として入る（PIN「${esc(HALL.demoPin)}」）</p><div class="row"><input id="pin2" type="password" inputmode="numeric" aria-label="PIN"><button class="btn" onclick="demoAdminPin('pin2')">管理者で入る</button></div></div>` : ""}`);
}
async function googleSignIn(){
  if (DEMO) return demoSignIn(0);
  const p = new firebase.auth.GoogleAuthProvider();
  try { await auth.signInWithPopup(p); closeSheet(); }
  catch(e) {
    if (["auth/popup-blocked","auth/operation-not-supported-in-this-environment","auth/cancelled-popup-request"].includes(e.code)) await auth.signInWithRedirect(p);
    else if (e.code !== "auth/popup-closed-by-user") toast(authMsg(e));
  }
}
async function emailAuth(mode){
  const email = $("#lg_email").value.trim(), pw = $("#lg_pw").value;
  if (!email || !pw) return toast("メールアドレスとパスワードを入力してください");
  if (DEMO) {
    const u = {uid:"demo-" + emailKey(email).replace(/[^a-z0-9]/g, "").slice(0, 24), displayName:"", email, emailVerified:true};
    closeSheet(); try { localStorage.setItem("ogawaDemoUser", JSON.stringify(u)); } catch(e) {} return watchUser(u);
  }
  try {
    if (mode === "signup") {
      const c = await auth.createUserWithEmailAndPassword(email, pw);
      try { await c.user.sendEmailVerification(); } catch(e) {}
      toast("アカウントを作りました。確認メールを送ったので、メールのリンクを開いてください");
    } else await auth.signInWithEmailAndPassword(email, pw);
    closeSheet();
  } catch(e) { toast(authMsg(e)); }
}
async function resetPw(){
  const email = $("#lg_email").value.trim(); if (!email) return toast("メールアドレスを入力してから押してください");
  if (DEMO) return toast("お試しモードではメールは送られません");
  try { await auth.sendPasswordResetEmail(email); toast("パスワード再設定のメールを送りました"); } catch(e) { toast(authMsg(e)); }
}
async function resendVerify(){ try { await auth.currentUser.sendEmailVerification(); toast("確認メールを送りました"); } catch(e) { toast(authMsg(e)); } }
async function reloadUser(){
  try { await auth.currentUser.reload(); await auth.currentUser.getIdToken(true); watchUser(auth.currentUser); if (!auth.currentUser.emailVerified) toast("まだ確認が済んでいません。メールのリンクを開いてください"); }
  catch(e) { toast(authMsg(e)); }
}
async function tryRosterActivate(){
  const u = S.user; if (!u || myOrgs().length || !isVerified(u)) return;
  const key = emailKey(u.email); if (!key) return;
  let r = null; try { r = await store.get(`rosterByEmail/${key}`); } catch(e) { return; }
  if (!r || !CATS[r.cat] || myOrgs().length || S.user !== u) return;
  const now = Date.now();
  try {
    await store.update({[`users/${u.uid}/orgs/roster`]:clean({group:r.group || "", name:r.name || u.displayName || "", tel:r.tel || "", email:u.email, cat:r.cat, status:"active", source:"名簿", createdAt:now, approvedAt:now})});
    toast("名簿に登録があったため、使用団体の登録が完了しました");
  } catch(e) { console.warn(e); }
}
function demoSignIn(i){ closeSheet(); const u = {...DEMO_USERS[i], emailVerified:true}; try { localStorage.setItem("ogawaDemoUser", JSON.stringify(u)); } catch(e) {} watchUser(u); }
async function demoAdminPin(inputId){
  if ($("#" + inputId).value !== HALL.demoPin) return toast("PINが違います");
  const u = {uid:"demo-admin", displayName:"デモ管理者", email:"admin@example.com"};
  await store.update({"admins/demo-admin":true, "adminRequests/demo-admin":{name:"デモ管理者", role:"管理人", email:u.email, status:"approved", at:Date.now()}});
  closeSheet(); try { localStorage.setItem("ogawaDemoUser", JSON.stringify(u)); } catch(e) {} watchUser(u);
}
async function signOut(){
  closeSheet(); S.adminEntry = false; S.form = {};
  if (DEMO) { try { localStorage.removeItem("ogawaDemoUser"); } catch(e) {} return watchUser(null); }
  await auth.signOut();
}

/* ===== 料金・空き判定 ===== */
function cellState(date, room, slot){
  if (date < today()) return "past";
  const o = S.slots[date] || {}, k = `${room}_${slot}`;
  if (o[k]) return o[k].status === "fixed" ? "fixed" : "hold";
  if (room === "ALL") { if (ROOM_IDS.some(r => o[`${r}_${slot}`])) return "blocked"; }
  else if (o[`ALL_${slot}`]) return "blocked";
  return "free";
}
function occRatio(date){
  const o = S.slots[date] || {}; let n = 0;
  SLOTS.forEach(s => { if (o[`ALL_${s.id}`]) { n += 5; return; } ROOM_IDS.forEach(r => { if (o[`${r}_${s.id}`]) n++; }); });
  return (n / 15).toFixed(2);
}
function groupCells(cells){
  const by = {}; cells.forEach(c => { const [r, s] = c.split("_"); (by[r] = by[r] || []).push(s); });
  Object.values(by).forEach(a => a.sort(slotOrder)); return by;
}

    if (isNew) up[`users/${S.user.uid}/orgs/${orgId}`] = clean({group:f.group, name:f.name, tel:f.tel, email:f.email, cat:S.cat, status:"pending", createdAt:now});
    await store.update(up);
    if (isNew) S.orgId = orgId;
    S.lastReq = req; S.sel = new Set(); S.form = {};
    go("done");
  } catch(e) {
    console.warn(e);
    btn.disabled = false; btn.textContent = "もう一度送信する";
    if (e.message === "taken") { toast("選んだ枠がちょうど埋まりました。空き状況を見て選び直してください"); S.sel = new Set(); go("board"); }
    else if (e.code === "PERMISSION_DENIED" || /permission/i.test(e.message)) toast("保存が許可されませんでした。枠が埋まったか、登録の状態が変わった可能性があります。画面を更新してください");

  }
}

function matchFilter(r, f){

  if (f === "closed") return !active(r);
  if (f === "all") return true;
  return r.status === f;
}
function reqCard(r){

  return `<button class="req" onclick="openDetail('${r.id}')">

function adminCal(){
  const [y, m] = S.month.split("-").map(Number), first = new Date(y, m-1, 1), dim = new Date(y, m, 0).getDate(), t = today();
  const list = reqList().filter(active);
  let h = `<section class="card">${monthNav()}<div class="cal">${[..."日月火水木金土"].map(w => `<div class="wh">${w}</div>`).join("")}`;

function openDay(ds){
  const items = reqList().filter(r => active(r) && reqDates(r).includes(ds));
  const who = (room, slot) => items.filter(r => (r.cells || []).includes(`${room}_${slot}`)).map(r => `<span class="ev ${ST[r.status].cls}" style="font-size:.75rem;height:auto">${esc(r.group || r.name)}</span>`).join("");
  S.openId = null; S.openOrg = null; S.sheetMode = null;
  showSheet(`<div class="sheet-head"><div><h2>${fmtFull(ds)}</h2><small>${items.length}件の利用</small></div><button class="x" onclick="closeSheet()" aria-label="閉じる">×</button></div>
    <div class="scroll"><table class="daytable"><thead><tr><th></th>${SLOTS.map(s => `<th>${s.name}</th>`).join("")}</tr></thead>
    <tbody>${ROOMS.map(R => `<tr><th>${R.name}</th>${SLOTS.map(s => `<td>${who(R.id, s.id)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
    ${items.map(reqCard).join("") || `<div class="empty">この日の利用はありません。</div>`}`);
}
function adminSum(){
  const mo = S.month, list = reqList().filter(r => r.date.startsWith(mo)), act = list.filter(active), t = today();
  const sum = a => a.reduce((s, r) => s + effFee(r), 0);
  const paidList = act.filter(r => r.payment), unpaid = act.filter(r => r.status === "approved" || isTent(r));
  const overdue = act.filter(r => r.status === "approved" && r.date <= t), waitCheck = act.filter(r => r.status === "paid" && lastDate(r) <= t);
  const byCat = Object.keys(CATS).map(k => { const a = act.filter(r => r.cat === k); return {k, n:a.length, amt:sum(a)}; }).filter(x => x.n);
  const koma = {}; ROOMS.forEach(R => koma[R.id] = 0);
  act.forEach(r => reqDates(r).forEach(() => (r.cells || []).forEach(c => koma[c.split("_")[0]]++)));
  return `<section class="card">${monthNav()}
    <dl class="stat"><dt>利用件数（取消・却下を除く）</dt><dd>${act.length}件</dd>
    <dt>使用料の合計</dt><dd>${yen(sum(act))}</dd>
    <dt>入金済み</dt><dd>${yen(paidList.reduce((s, r) => s + Number(r.payment.amount || 0), 0))}（${paidList.length}件）</dd>
    <dt>未入金（仮予約を含む）</dt><dd class="${unpaid.length ? "warn" : ""}">${yen(sum(unpaid))}（${unpaid.length}件）</dd>
    <dt>利用日を過ぎた未収</dt><dd class="${overdue.length ? "warn" : ""}">${overdue.length}件</dd>
    <dt>使用後チェック待ち</dt><dd class="${waitCheck.length ? "warn" : ""}">${waitCheck.length}件</dd></dl></section>
    ${overdue.length || waitCheck.length ? `<section class="card"><h2>対応が必要な申込</h2>${[...overdue, ...waitCheck].map(reqCard).join("")}</section>` : ""}
    <section class="card"><h2>利用区分別</h2>${byCat.length ? `<table class="list"><thead><tr><th>区分</th><th class="r">件数</th><th class="r">使用料</th></tr></thead><tbody>
      ${byCat.map(x => `<tr><td>${x.k} ${CATS[x.k].name}</td><td class="r">${x.n}</td><td class="r">${yen(x.amt)}</td></tr>`).join("")}</tbody></table>` : `<div class="empty">この月の利用はまだありません。</div>`}</section>

  },

/* ===== シート ===== */
function showSheet(html){ const s = $("#sheet"); const top = s.querySelector(".panel")?.scrollTop || 0; s.innerHTML = `<div class="scrim" onclick="closeSheet()"></div><div class="panel" role="dialog" aria-modal="true">${html}</div>`; if (s.classList.contains("open")) s.querySelector(".panel").scrollTop = top; s.classList.add("open"); document.body.style.overflow = "hidden"; }
function closeSheet(){ const s = $("#sheet"); s.classList.remove("open"); s.innerHTML = ""; S.openId = null; S.openOrg = null; S.sheetMode = null; document.body.style.overflow = ""; }
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#sheet").classList.contains("open")) closeSheet(); });
function setMode(m){ S.sheetMode = m; if (S.openId) openDetail(S.openId); else if (S.openOrg) openOrg(S.openOrg.uid, S.openOrg.oid); }
async function act(up, msg){
  try { await store.update(up); toast(msg); S.sheetMode = null; if (S.openId) openDetail(S.openId); else if (S.openOrg) openOrg(S.openOrg.uid, S.openOrg.oid); render(); }
  catch(e) { console.warn(e); toast("保存できませんでした：" + (e.code || e.message)); }
}

/* 利用者の審査 */

  const mine = reqList().filter(r => r.uid === uid && r.orgId === oid).sort((a, b) => a.date.localeCompare(b.date));
  const tents = mine.filter(isTent), m = S.sheetMode;
  const others = Object.entries(S.users[uid]?.orgs || {}).filter(([k]) => k !== oid).map(([k, o]) => ({uid, oid:k, ...o}));
  const acct = S.users[uid]?.lastResp;
  let h = `<div class="sheet-head"><div><span class="pill ${USER_ST[u.status].cls}">${USER_ST[u.status].name}</span><h2>${esc(orgLabel(u))}</h2>
    <small>${fmtTs(u.createdAt)} 申請${u.approvedAt ? `／${fmtTs(u.approvedAt)} 承認` : ""}</small></div><button class="x" onclick="closeSheet()" aria-label="閉じる">×</button></div>

    <dt>希望の区分</dt><dd>${esc(CATS[u.cat]?.name || "")}</dd>${u.rejectReason ? `<dt>断った理由</dt><dd>${esc(u.rejectReason)}</dd>` : ""}
    ${others.length ? `<dt>同じアカウント</dt><dd>${others.map(o => `<button class="link" onclick="openOrg('${uid}','${o.oid}')">${esc(orgLabel(o))}（${USER_ST[o.status].name}）</button>`).join("<br>")}</dd>` : ""}</dl>

  if (m === "ureject") {
    h += `<div class="sec"><h3>登録を断る理由</h3><div class="field"><input id="u_rs" placeholder="例 地域外のため、連絡がつかないため"></div>
      <p class="hint" style="margin-top:0">断ると、この団体の仮予約${tents.length}件も却下され、枠が空きに戻ります。</p>
      <div class="btns"><button class="btn danger" onclick="rejectUser()">登録を断る</button><button class="btn ghost" onclick="setMode(null)">やめる</button></div></div>`;
  } else if (u.status === "active") {
    h += `<div class="btns"><button class="btn ghost" onclick="changeUserCat()">区分を変更する</button><button class="btn ghost" onclick="setMode('ureject')">登録を取り消す</button></div>`;
    if (tents.length) h += `<div class="btns"><button class="btn appr" onclick="approveUser()">残っている仮予約を確定する</button></div>`;
  } else {
    h += `<p class="hint" style="margin-top:0">承認すると登録完了となり、この団体の仮予約${tents.length}件が予約確定になります。区分を変えた場合は、仮予約の使用料も新しい区分で計算し直します。</p>
      <div class="btns"><button class="btn appr" onclick="approveUser()">承認して登録する</button>${u.status === "pending" ? `<button class="btn ghost" onclick="setMode('ureject')">登録を断る</button>` : ""}</div>`;
  }
  h += `<div class="sec"><h3>この団体の申込（${mine.length}件）</h3>${mine.map(reqCard).join("") || `<div class="empty">申込はありません。</div>`}</div>`;
  showSheet(h);
}
function approveUser(){
  const {uid, oid} = S.openOrg, P = `users/${uid}/orgs/${oid}`, cat = $("#u_cat").value, now = Date.now();
  const up = {[`${P}/status`]:"active", [`${P}/cat`]:cat, [`${P}/approvedAt`]:now, [`${P}/rejectReason`]:null};
  let changed = 0;
  reqList().filter(r => r.uid === uid && r.orgId === oid && isTent(r)).forEach(r => {
    let fee = r.fee, rc = r.cat;
    if (cat !== r.cat) {
      const nf = calcFee(cat, r.cells || [], 1);
      if (nf.lines.length === calcFee(r.cat, r.cells || [], 1).lines.length) { fee = nf; rc = cat; changed++; }
    }
    up[`requests/${r.id}/status`] = "approved"; up[`requests/${r.id}/approvedAt`] = now;
    up[`requests/${r.id}/cat`] = rc; up[`requests/${r.id}/fee`] = fee;
    up[`status/${r.no}/status`] = "approved"; up[`status/${r.no}/fee`] = r.feeAdj ? r.feeAdj.amount : fee.total;
    slotPaths(r).forEach(p => up[`${p}/status`] = "fixed");
  });
  act(up, changed ? `登録しました（${changed}件の使用料を新しい区分で計算し直しました）` : "登録しました。仮予約は予約確定になりました");
}
function rejectUser(){
  const {uid, oid} = S.openOrg, P = `users/${uid}/orgs/${oid}`, reason = $("#u_rs").value.trim(), now = Date.now();
  const up = {[`${P}/status`]:"rejected", [`${P}/rejectReason`]:reason || null, [`${P}/rejectedAt`]:now};
  reqList().filter(r => r.uid === uid && r.orgId === oid && isTent(r)).forEach(r => closeReqUpdate(up, r, "rejected", reason || "使用団体の登録が承認されなかったため"));
  act(up, "登録を断りました");
}
function changeUserCat(){ const {uid, oid} = S.openOrg; act({[`users/${uid}/orgs/${oid}/cat`]:$("#u_cat").value}, "区分を変更しました（これからの申込に使われます）"); }
function approveAdmin(uid){ act({[`admins/${uid}`]:true, [`adminRequests/${uid}/status`]:"approved", [`adminRequests/${uid}/approvedAt`]:Date.now()}, "管理者として承認しました"); }
function rejectAdmin(uid){ if (!confirm("この管理者申請を断りますか？")) return; act({[`adminRequests/${uid}/status`]:"rejected"}, "申請を断りました"); }

const REQ_HEAD = ["受付番号","受付日時","受付方法","利用日","利用区分","団体名","代表者","電話","メール","使用責任者","責任者住所","責任者電話","責任者メール","利用目的","人数","部屋・時間帯","使用料","状態","利用者登録","支払方法","入金日","入金額","領収書番号","チェック日時","確認者","破損・汚損","連絡事項","管理メモ"];
const USER_HEAD = ["種別","状態","団体名","代表者","電話","メール","利用区分","申請日","承認日","備考"];
function downloadCSV(name, rows){
  const csv = "\ufeff" + rows.map(row => row.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",")).join("\r\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv"}));
  a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function parseCSV(text){
  text = text.replace(/^\ufeff/, "");
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i+1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i+1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
    else f += c;
  }
  if (f !== "" || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => String(x).trim() !== ""));
}
async function readCSVFile(file){
  const buf = await file.arrayBuffer(); let t;
  try { t = new TextDecoder("utf-8", {fatal:true}).decode(buf); } catch(e) { t = new TextDecoder("shift_jis").decode(buf); }
  return parseCSV(t);
}
const z2h = s => String(s || "").replace(/[０-９Ａ-Ｚａ-ｚ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/　/g, " ").trim();
const digits = s => z2h(s).replace(/\D/g, "");
const toNum = s => { const d = z2h(s).replace(/[¥￥,円\s]/g, ""); return d === "" || isNaN(Number(d)) ? null : Number(d); };
function parseDateCSV(s){
  const m = z2h(s).match(/(\d{4})\s*[-\/.年]\s*(\d{1,2})\s*[-\/.月]\s*(\d{1,2})/);
  if (!m) return "";
  const d = new Date(+m[1], +m[2]-1, +m[3]);
  return d.getMonth() === +m[2]-1 ? ymd(d) : "";
}
function parseCat(s){
  s = z2h(s); if (!s) return "";
  const h = s.match(/^([A-Da-d])(\s|$)/); if (h) return h[1].toUpperCase();
  for (const [k, c] of Object.entries(CATS)) if (s.includes(c.name) || c.name.includes(s)) return k;
  if (/老人|婦人|子供|子ども/.test(s)) return "C";
  if (/福祉|自治会/.test(s)) return "D";
  if (/一般/.test(s)) return "B";
  if (/会員/.test(s)) return "A";
  return "";
}
function parseCells(s){
  s = z2h(s); if (!s) return null;
  const cells = [], rooms = [...ROOMS].sort((a, b) => b.name.length - a.name.length);
  for (let part of s.split(/[／\/;；、\n]+/)) {
    part = part.replace(/\s+/g, " ").trim(); if (!part) continue;
    const R = rooms.find(r => part.startsWith(r.name) || part.startsWith(r.name.replace(/(ホール|和室)(.)/, "$1 $2")) || part.startsWith(r.short));
    if (!R) return null;
    const rest = part.slice(R.name.length);
    const ss = /全日/.test(rest) ? SLOTS.map(x => x.id) : SLOTS.filter(x => rest.includes(x.name)).map(x => x.id);
    if (!ss.length) return null;
    ss.forEach(x => { const k = `${R.id}_${x}`; if (!cells.includes(k)) cells.push(k); });
  }
  return cells.length ? cells : null;
}
function parseStatus(s){
  s = z2h(s);
  if (/完了/.test(s)) return "done";
  if (/支払済|支払い済|入金済/.test(s)) return "paid";
  if (/却下|不可/.test(s)) return "rejected";
  if (/取消|取り消|キャンセル/.test(s)) return "cancelled";
  return "approved";
}
function headIndex(rows){
  const hdr = rows[0].map(h => z2h(h));
  const idx = n => hdr.indexOf(n);
  const get = (r, ...ns) => { for (const n of ns) { const i = idx(n); if (i >= 0 && r[i] != null && String(r[i]).trim() !== "") return String(r[i]).trim(); } return ""; };
  return {idx, get};
}

function analyzeReqRows(rows){
  const {idx, get} = headIndex(rows);

  const nos = new Set(reqList().map(r => r.no)), taken = {};
  Object.entries(S.slots || {}).forEach(([d, o]) => taken[d] = {...o});
  return {rows:rows.slice(1).map((r, i) => {
    const e = [], line = i + 2;
    const date = parseDateCSV(get(r, "利用日")); if (!date) e.push("利用日が読めません");
    const cat = parseCat(get(r, "利用区分")); if (!cat) e.push("利用区分が読めません");
    const cells = parseCells(get(r, "部屋・時間帯")) || []; if (!cells.length) e.push("部屋・時間帯が読めません");

    let status = parseStatus(get(r, "状態"));
    if (!e.length && active({status})) {
      const t = taken[date] || {};
      for (const c of cells) {
        const [rm, sl] = c.split("_");
        if (t[c] || (rm === "ALL" ? ROOM_IDS.some(x => t[`${x}_${sl}`]) : t[`ALL_${sl}`])) { e.push(`${ROOMS.find(x => x.id === rm).name} ${slotName(sl)}は予約済みです`); break; }
      }

      no, date, cat, cells, group, name, tel:get(r, "電話"), email:get(r, "メール"),

      note:get(r, "連絡事項", "備考"), adminMemo:get(r, "管理メモ"), status, fee,
      feeAdj:feeNum != null && feeNum !== fee.total ? {amount:feeNum, reason:"CSV取込時の金額"} : null,
      payment:hasPay ? {method:get(r, "支払方法") || "現金", amount:paidAmt ?? feeNum ?? fee.total, paidAt:paidAt || date, receiptNo:get(r, "領収書番号"), at:Date.now()} : null}};
  })};
}
function rosterMatchData(d){

function analyzeUserRows(rows){

      if (k && seen.has(k)) e.push("ファイル内で重複しています"); if (k) seen.add(k);
    }
    return {line, ok:!e.length, errors:e, show:[d.group || "（個人）", d.name, d.cat ? `${d.cat} ${CATS[d.cat].name}` : get(r, "利用区分")], data:e.length ? null : d};
  })};
}
function showImport(){
  const im = S.imp, ok = im.rows.filter(x => x.ok).length, ng = im.rows.length - ok, isReq = im.kind === "req";
  const cols = isReq ? ["利用日","利用者","部屋・時間"] : ["団体名","代表者","区分"];
  S.openId = null; S.openOrg = null; S.sheetMode = "import";
  showSheet(`<div class="sheet-head"><div><h2>${isReq ? "申込" : "名簿"}CSVの取り込み</h2><small>${esc(im.file)}：${im.rows.length}行（取り込める ${ok}件／取り込めない ${ng}件）</small></div><button class="x" onclick="closeSheet()" aria-label="閉じる">×</button></div>
    <div class="scroll"><table class="list imp"><thead><tr><th>行</th>${cols.map(c => `<th>${c}</th>`).join("")}<th>結果</th></tr></thead><tbody>
    ${im.rows.map(x => `<tr class="${x.ok ? "" : "ng"}"><td>${x.line}</td>${x.show.map(v => `<td>${esc(v)}</td>`).join("")}<td>${x.ok ? (isReq ? `<span class="pill ${ST[x.data.status].cls}">${ST[x.data.status].adm}</span> ${yen(x.data.feeAdj ? x.data.feeAdj.amount : x.data.fee.total)}` : "OK") : esc(x.errors.join("、"))}</td></tr>`).join("")}
    </tbody></table></div>
    <div class="btns"><button class="btn" ${ok ? "" : "disabled"} onclick="doImport(this)">${ok}件を取り込む</button><button class="btn ghost" onclick="closeSheet()">やめる</button></div>`);
}
async function doImport(btn){
  const im = S.imp; if (!im) return; btn.disabled = true; btn.textContent = "取り込んでいます…";
  const items = im.rows.filter(x => x.ok).map(x => x.data), now = Date.now();
  try {
    if (im.kind === "req") {
      const nos = new Set(reqList().map(r => r.no)), A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789", base = today().replace(/-/g, "").slice(2);
      for (let i = 0; i < items.length; i += 40) {
        const up = {};
        items.slice(i, i + 40).forEach(d => {
          let no = d.no;
          while (!no || (nos.has(no) && no !== d.no)) no = `${base}-${[...Array(4)].map(() => A[Math.floor(Math.random()*A.length)]).join("")}`;
          nos.add(no);
          const id = genId(), req = clean({...d, no, createdAt:now, source:"CSV", uid:null, date2:null, days:1, approvedAt:now,
            feeAdj:d.feeAdj || undefined, payment:d.payment || undefined});
          const part = buildUpdate(id, req);
          if (!active(req)) Object.keys(part).forEach(k => { if (k.startsWith("slots/")) delete part[k]; });
          Object.assign(up, part);
        });
        await store.update(up);
      }
    } else {
      const up = {};
      items.forEach(d => {
        const id = genId(); up[`roster/${id}`] = clean({...d, importedAt:now});
        const k = emailKey(d.email); if (k) up[`rosterByEmail/${k}`] = clean({cat:d.cat, group:d.group, name:d.name, tel:d.tel, email:d.email, rosterId:id});
      });
      await store.update(up);
    }
    S.imp = null; closeSheet(); render(); toast(`${items.length}件を取り込みました`);
  } catch(e) { console.warn(e); btn.disabled = false; btn.textContent = "もう一度取り込む"; toast("取り込めませんでした：" + (e.code || e.message)); }
}

/* 名簿 */
function rosterMatch(u){
  const em = emailKey(u.email), tel = digits(u.tel);
  return Object.entries(S.roster || {}).map(([id, r]) => ({id, ...r}))
    .filter(r => (em && emailKey(r.email) === em) || (tel.length >= 6 && digits(r.tel) === tel));
}
function rosterHint(u){
  const m = rosterMatch(u); if (!m.length) return "";
  return `<div class="note ok" style="margin:0 0 12px">名簿に一致：${m.map(r => `${esc(r.group || "（個人）")} ${esc(r.name)}（${r.cat} ${esc(CATS[r.cat]?.name || "")}）`).join("、")}${u.status !== "active" ? "。区分を名簿に合わせています。" : ""}</div>`;
}
function rosterSection(){
  const list = Object.entries(S.roster || {}).map(([id, r]) => ({id, ...r})).sort((a, b) => (a.group || a.name).localeCompare(b.group || b.name, "ja"));
  return `<section class="card"><h2>名簿<small>登録予定 ${list.length}件</small></h2>
    <p class="hint" style="margin-top:0">設定タブの「名簿CSVを取り込む」で追加します。名簿のメールアドレスでログインした人は自動で登録済みになります。</p>
    ${list.length ? `<details class="more-box"><summary>名簿を見る</summary><table class="list"><tbody>${list.map(r => `<tr><td>${esc(r.group || "（個人）")}<br><small style="color:var(--sub)">${esc(r.name)}・${esc(r.tel || "")} ${esc(r.email || "")}</small></td><td>${r.cat}</td>
      <td class="r"><button class="btn sm ghost" onclick="deleteRoster('${r.id}')">削除</button></td></tr>`).join("")}</tbody></table>
      <div class="btns"><button class="btn sm ghost" onclick="deleteRoster('*')">名簿をすべて削除</button></div></details>` : ""}</section>`;
}
function deleteRoster(id){
  const list = id === "*" ? Object.entries(S.roster || {}).map(([k, r]) => ({id:k, ...r})) : [{id, ...S.roster[id]}];
  if (!confirm(id === "*" ? `名簿の${list.length}件をすべて削除しますか？` : `${list[0].group || list[0].name} を名簿から削除しますか？`)) return;
  const up = {};
  list.forEach(r => { up[`roster/${r.id}`] = null; const k = emailKey(r.email); if (k && S.roster) up[`rosterByEmail/${k}`] = null; });
  act(up, "名簿から削除しました");
}

function resetDemo(){
  if (!confirm("お試しデータをすべて消します。よろしいですか？")) return;
  demoTree = {}; try { localStorage.removeItem(DEMO_KEY); localStorage.removeItem("ogawaDemoUser"); } catch(e) {}
  S.slots = {}; closeSheet(); watchUser(null); store.update({}); toast("消去しました");
}

/* ===== 起動 ===== */
function init(){
  if (!DEMO) {
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.database(); auth = firebase.auth();
    auth.getRedirectResult().catch(() => {});
    auth.onAuthStateChanged(u => watchUser(u && !u.isAnonymous ? u : null));
  } else {
    let u = null; try { u = JSON.parse(localStorage.getItem("ogawaDemoUser") || "null"); } catch(e) {}
    watchUser(u);
  }
  store.on("slots", v => { S.slots = v || {}; if (S.view === "board") render(); });
}
init();

/* ===== アプリとしてインストール ===== */
let deferredPrompt = null;
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(e => console.warn("SW", e)));
}
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredPrompt = e; $("#installBtn").hidden = false; });
window.addEventListener("appinstalled", () => { deferredPrompt = null; $("#installBtn").hidden = true; toast("ホーム画面に追加しました"); });
async function installApp(){
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice.catch(() => {});
  deferredPrompt = null; $("#installBtn").hidden = true;
}
